# ==============================================================================
# MetaFusion 生产镜像编排覆盖
#
# 部署入口：./deploy.sh pull；脚本验证发布清单后附加临时 digest 覆盖。
# 手动执行 Compose 时也必须附加按同一清单生成的 digest 覆盖文件。
#
# backend、frontend、backend-migrate 使用 GHCR 预构建镜像；其他应用由部署脚本
# 从锁定的兄弟仓源码构建。部署机只需 Docker Compose，不直接安装 Go/Node/Bun。
#
# 版本钉死（审计 O05）：IMAGE_TAG 是发布清单的标签归属检查；
#   deploy.sh pull 拒绝 latest/空，并生成临时 Compose 覆盖文件，把下面三个
#   预构建服务的 image 改成清单中的 repository@sha256 引用。
#   摘要镜像拉取失败即中断，不用本地旧标签兜底。
#
# R3 多副本扩容（本文件统一收口）：无状态服务（frontend/docs-site/四个业务服务/
#   四个自带管理台与自助应用）的固定 container_name 在此全部 !reset，常规
#   `up -d --scale backend=2` 可直接复制副本。寻址一律走服务名 DNS（网关
#   nginx.conf 与各服务 URL 全是 http://backend:8080 这类服务名），不依赖容器名；
#   deploy.sh 只 exec metafusion-gateway，它与 postgres/rustfs/opensearch/迁移作业
#   一样保持单实例固定名。
#   扩容时沿用同一发布清单的 digest 覆盖，并加 --scale backend=2 --scale auth=2。
#   连接池总量预算：目录库每进程 MaxOpenConns=64（backend/internal/catalog/store.go），
#   连接池预算 = 64 × 目录副本数 + 32 × (账号+互动+存储+MCP副本数) + 迁移作业(1) + 运维连接，必须 ≤ postgres max_connections；
#   加副本前先核算，不够先调大库侧再扩（进程内限流同理按副本数折算，见目标架构 §4 R3）。
#   单实例限定：带本地卷的服务（postgres/pg_data、storage/storage_data 本地暂存、
#   rustfs/s3_data）不扩；多副本的对象源必须是共享的 rustfs，纯本地目录模式只许单实例。
#   迁移只跑一次：backend-migrate/community-migrate 是 profiles: tools 一次性作业，
#   只由 deploy.sh 调 run --rm 跑一次，永不 --scale；迁移器镜像与本次发布同源
#   （见下面 backend-migrate 段与 release-manifest.yaml 的 same_source 绑定）。
# ==============================================================================

# 所有服务共用同一份容器日志上限：json-file 驱动 + 单文件 10 MiB + 保留 3 份。
# 不设上限时 docker 默认的 json-file 会一直涨，生产机磁盘本就不宽裕（2026-09 审计：/ 曾到 95%），
# 一次日志爆量就能把宿主盘打满，连 PostgreSQL 一起拖死；上限只截断历史，不影响实时排障。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    logging: *default-logging
    build: !reset null
    # R3：去固定名，扩容副本由 compose 按服务名编排（单副本时名字变为 <工程>-frontend-1）
    container_name: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/moeclub-open/metafusion}/frontend:${IMAGE_TAG:-latest}
    restart: always

  # 文档站镜像目前没有任何仓库发布（metafusion-docs 的 CI 只跑 VitePress 构建与死链自查），
  # reset 掉 build 会让文档站在拉取路径下无镜像可选；deploy.sh pull 会从锁定的
  # ../../metafusion-docs 显式构建（账号/互动/存储同理）。
  docs-site:
    logging: *default-logging
    # R3：同 frontend，去固定名（静态站无状态，可多副本）
    container_name: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/moeclub-open/metafusion}/docs-site:${IMAGE_TAG:-latest}
    restart: always

  backend:
    logging: *default-logging
    build: !reset null
    # R3：去固定名；扩容前先按头注释核算连接池总量预算
    container_name: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/moeclub-open/metafusion}/backend:${IMAGE_TAG:-latest}
    restart: always

  # R3：账号/互动/存储及各管理台由 deploy.sh pull 显式构建；
  # 这里只去固定名，扩容寻址走服务名，本地卷单实例限定见头注释。
  auth:
    logging: *default-logging
    container_name: !reset null

  mcp:
    logging: *default-logging
    container_name: !reset null
    restart: always

  community:
    logging: *default-logging
    container_name: !reset null

  storage:
    logging: *default-logging
    # storage_data 是本地暂存卷：多副本前必须确认对象源为共享 rustfs，纯本地目录模式只许单实例
    container_name: !reset null

  auth-admin:
    logging: *default-logging
    container_name: !reset null

  auth-user:
    logging: *default-logging
    container_name: !reset null

  community-admin:
    logging: *default-logging
    container_name: !reset null

  storage-admin:
    logging: *default-logging
    container_name: !reset null

  # 迁移作业同样走预构建（审计 §6）：pull 路径跑的是拉下来那份镜像里的迁移器，
  # 而不是本地那张旧标签——base 里的 metafusion-migrator:local 在这里不再可选。
  # 去 build，覆盖为本次发布的 GHCR migrator 镜像（release.yml 的 backend-migrator 矩阵项）。
  # IMAGE_TAG 只用于清单归属；deploy.sh pull 的临时覆盖将 image 换成清单里的 digest。
  backend-migrate:
    logging: *default-logging
    build: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/moeclub-open/metafusion}/migrator:${IMAGE_TAG:-latest}
