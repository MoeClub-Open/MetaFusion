# ==============================================================================
# 元数据-only 编排：只拉起目录侧（PostgreSQL + OpenSearch + 目录服务 + 前端 + 可选文档站 + 网关）。
# 账号 / 互动 / 存储缺席时前端仍会请求那三个上游（页面级 API 打到不存在的服务），所以这个组合
# 只用于目录侧开发/验收，不是"部分部署"的受支持形态。
# 镜像命名与构建入参一律以主编排 deploy/docker-compose.yml 为准：同一个服务不出现第二套名字，
# 也不使用任何没有发布方的镜像名（那种名字既拉不到、也无法与主编排复用同一份构建）。
# 三个服务自带的管理台（deploy/docker-compose.yml 的 auth-admin / community-admin / storage-admin）不在本栈内：
# 本栈只起目录侧，没有 auth/community/storage，管理台起了也没有可管的上游。
# 文档站是 --profile docs 的可选件：不开这个 profile 它完全不参与启动，而 nginx.metadata.conf
# 里 /docs/ 的 location 仍在，请求必然 502（本编排的取舍，不是配置错误）。
# ==============================================================================
# 所有服务共用同一份容器日志上限：json-file 驱动 + 单文件 10 MiB + 保留 3 份。
# 不设上限时 docker 默认的 json-file 会一直涨，生产机磁盘本就不宽裕（2026-09 审计：/ 曾到 95%），
# 一次日志爆量就能把宿主盘打满，连 PostgreSQL 一起拖死；上限只截断历史，不影响实时排障。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    shm_size: 256m
    container_name: metafusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-metafusion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-metafusion_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${DB_USER:-metafusion} -d ${DB_NAME:-metafusion_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [metafusion-net]

  backend:
    logging: *default-logging
    # 与主编排同名同标签：两份编排构建出的目录服务镜像可以互相复用。
    image: metafusion-backend:${METAFUSION_TAG:-local}
    build:
      context: ../backend
      # 目录服务的运行镜像就是 backend/Dockerfile 的 server 阶段（没有 catalog-server 阶段，
      # 写错会让该编排在 build 时报 target stage could not be found，而 config 检查发现不了）。
      target: server
      # 与主编排同口径：/api/version 的版本身份在构建期注入（deploy.sh 导出 METAFUSION_GIT_SHA）。
      args:
        GIT_SHA: ${METAFUSION_GIT_SHA:-unknown}
        APP_VERSION: ${METAFUSION_VERSION:-unknown}
      labels:
        io.metafusion.project: metafusion
    container_name: metafusion-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL:?CATALOG_DATABASE_URL must be set}
      CATALOG_PUBLIC_URL: ${CATALOG_PUBLIC_URL:-https://findverse.cc}
      CATALOG_SOURCE_BLOCKED_HOSTS: ${CATALOG_SOURCE_BLOCKED_HOSTS:-}
      CATALOG_OUTBOX_RETENTION_DAYS: ${CATALOG_OUTBOX_RETENTION_DAYS:-7}
      CATALOG_COMMIT_REQUEST_RETENTION_DAYS: ${CATALOG_COMMIT_REQUEST_RETENTION_DAYS:-90}
      CATALOG_RETENTION_INTERVAL_SECONDS: ${CATALOG_RETENTION_INTERVAL_SECONDS:-3600}
      # metadata-only 可接外部存储；留空时不启用生命周期投递。
      STORAGE_URL: ${STORAGE_URL:-}
      STORAGE_CATALOG_LIFECYCLE_SECRET: ${STORAGE_CATALOG_LIFECYCLE_SECRET:-}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      # 与主编排同口径：应用层限流按真实客户端 IP（只信网关注所在网段，见 backend/internal/nettrust）。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      postgres: {condition: service_healthy}
      opensearch: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/ready]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [metafusion-net]

  opensearch:
    logging: *default-logging
    image: opensearchproject/opensearch:2.14.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [metafusion-net]

  frontend:
    logging: *default-logging
    # 不写 image：主编排也没给前端命名，两个编排文件同在 deploy/ 下时由 compose 生成同一个
    # 镜像名，复用同一份构建产物。构建入参也必须与主编排一致，否则同一镜像名下会出现两种前端
    # 产物（NEXT_PUBLIC_* 是构建期内联，运行期 environment 无效）。
    build:
      context: ../frontend
      args:
        BACKEND_ORIGIN: "http://backend:8080"
        NEXT_PUBLIC_RESOURCE_STATION_URL: ${NEXT_PUBLIC_RESOURCE_STATION_URL:-}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-}
      labels:
        io.metafusion.project: metafusion
    container_name: metafusion-frontend
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    networks: [metafusion-net]

  docs-site:
    logging: *default-logging
    profiles: [docs]
    # 文档站镜像没有任何仓库发布（metafusion-docs 的 CI 只构建站点、不发布容器镜像，
    # 见 .github/workflows/release.yml 的镜像矩阵），所以它只能就地构建，同样不显式命名镜像。
    build:
      # 文档内容在独立仓库 metafusion-docs（唯一源）；可用 MF_DOCS_DIR 覆盖布局
      context: ${MF_DOCS_DIR:-../../metafusion-docs}
      labels:
        io.metafusion.project: metafusion
    container_name: metafusion-docs
    restart: unless-stopped
    environment: {PORT: "3001"}
    networks: [metafusion-net]

  gateway:
    logging: *default-logging
    image: nginx:1.25-alpine
    container_name: metafusion-gateway
    restart: unless-stopped
    ports: ["${HTTP_PORT:-10100}:80"]
    volumes:
      - ./nginx.metadata.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on: [frontend, backend]
    networks: [metafusion-net]

volumes:
  pg_data:
  opensearch_data:
  nginx_logs:
networks:
  metafusion-net:
    driver: bridge
