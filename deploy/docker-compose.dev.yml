# ==============================================================================
# MetaFusion - 本地极速热重载开发配置 (Zero-Rebuild Development Override)
# 使用方法: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   （backend 在 dev 下用独立镜像名，首次 up 会自动构建 builder 阶段；改过本文件的 build 配置后
#    先跑一次 docker compose -f docker-compose.yml -f docker-compose.dev.yml build backend）
# 特点: 源码直接挂载，前端 / 文档站秒级 Fast Refresh 热重载，完全无需每次重新构建 Docker 镜像！
# 前端使用固定的 Bun 1.4.3 运行时（oven/bun:1.4.3-alpine）
# 目录服务（Go）是编译型语言又没有 watcher 依赖：这里换到 backend/Dockerfile 的 builder 阶段
# （容器内有 Go 工具链）跑 `go run ./cmd/server`，改完代码 restart backend 重新编译即可。
# ==============================================================================
# 所有服务共用同一份容器日志上限：json-file 驱动 + 单文件 10 MiB + 保留 3 份。
# 不设上限时 docker 默认的 json-file 会一直涨，生产机磁盘本就不宽裕（2026-09 审计：/ 曾到 95%），
# 一次日志爆量就能把宿主盘打满，连 PostgreSQL 一起拖死；上限只截断历史，不影响实时排障。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    logging: *default-logging
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: deps
    container_name: metafusion-frontend-dev
    command: bun run dev -- -p 3000
    volumes:
      - ../frontend/src:/app/src:ro
      - ../frontend/public:/app/public:ro
      - ../frontend/package.json:/app/package.json:ro
      # Next 会读的入口与配置文件：漏挂就等于容器里跑镜像内那份旧配置——Tailwind 的 postcss
      # 插件不生效、middleware 不跑、tsconfig 的 @/* 路径别名解析不了。
      - ../frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ../frontend/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ../frontend/next.config.mjs:/app/next.config.mjs:ro
      - ../frontend/middleware.ts:/app/middleware.ts:ro
      - ../frontend/tsconfig.json:/app/tsconfig.json:ro
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true

  backend:
    logging: *default-logging
    # 目录服务是编译型：dev 栈承诺的"改代码即时生效"只能靠容器内跑源码，所以换到 builder 阶段
    # （golang:1.27.3-alpine，容器内有 Go 工具链），入口改成 go run。原来的写法是把源码挂到 server
    # 阶段的 /app 上，正好盖掉镜像里的 /app/server，容器以 exec: /app/server: no such file or
    # directory 起不来——本编排此前因此整体不可用（网关等 backend healthy，永远不开门）。
    # 不能沿用主编排的 metafusion-backend:local：那是 server 阶段的镜像（alpine，没有 go），
    # 一旦本地已有该镜像，compose 不会重建，go run 会以 exec: go: not found 失败。
    image: metafusion-backend-dev:${METAFUSION_TAG:-local}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: builder
    entrypoint: ["go", "run", "./cmd/server"]
    working_dir: /app
    environment:
      # 与 Dockerfile 的构建口径一致：alpine 镜像里没有 gcc，别让 cgo 参与编译。
      - CGO_ENABLED=0
    volumes:
      - ../backend:/app:ro
      # 模块与编译缓存放命名卷：首次启动拷一次依赖，之后 restart 不再重下（源码卷是 :ro）。
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    # 健康检查必须换写法：server 阶段装了 curl，golang 阶段只有 busybox wget，照抄 curl 会让
    # backend 永远 unhealthy，而网关是 depends_on: service_healthy —— 网关就永远不开门。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/ready"]

  docs-site:
    logging: *default-logging
    build:
      context: ${MF_DOCS_DIR:-../../metafusion-docs}
      dockerfile: Dockerfile
      target: deps
    container_name: metafusion-docs-dev
    command: npm run dev
    # VitePress 项目：内容与配置都在 docs/ 下（docs/.vitepress/config.mts），
    # 静态资源为 docs/public；无 Next.js 的 src/content/next.config.mjs，故不再挂载。
    volumes:
      - ${MF_DOCS_DIR:-../../metafusion-docs}/docs:/app/docs:ro
      - ${MF_DOCS_DIR:-../../metafusion-docs}/package.json:/app/package.json:ro
    environment:
      - NODE_ENV=development
      - PORT=3001
      - WATCHPACK_POLLING=true

volumes:
  go_mod_cache:
  go_build_cache:
