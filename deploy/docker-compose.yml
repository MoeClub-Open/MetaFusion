# ==============================================================================
# MetaFusion 全系统编排：一条命令拉起网关 + 前端 + 文档站 + 元数据目录 + 账号 +
# 互动 + 存储，以及基础设施 (PostgreSQL / RustFS)。
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# 账号 / 互动 / 存储三个服务与主仓库并列检出（deploy/../.. 下的 metafusion-*），
# 因此这里用跨仓库构建上下文；只检出主仓库的机器需改用预构建镜像。
#
# 唯一对外端口是网关 (HTTP_PORT)，其余服务只在 metafusion-net 内可达，避免重复暴露。
# 路由归属以 docs/architecture/service-split-migration.md 第 2 节为准。
# ==============================================================================
# 所有服务共用同一份容器日志上限：json-file 驱动 + 单文件 10 MiB + 保留 3 份。
# 不设上限时 docker 默认的 json-file 会一直涨，生产机磁盘本就不宽裕（2026-09 审计：/ 曾到 95%），
# 一次日志爆量就能把宿主盘打满，连 PostgreSQL 一起拖死；上限只截断历史，不影响实时排障。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --------------------------------------------------------------------------
  # 0. 边缘网关 (Nginx) — 统一入口：按前缀分流到各自治服务
  #    路由矩阵就是挂进来的 ./nginx.conf（唯一生效来源）；metafusion-api-gateway 仓库
  #    只保留切流自检脚本，它自己的 nginx.conf 不参与部署。
  # --------------------------------------------------------------------------
  gateway:
    logging: *default-logging
    image: nginx:1.30.6-alpine
    container_name: metafusion-gateway
    restart: unless-stopped
    ports:
      # 绑回环，不绑 0.0.0.0：公网入口是 Cloudflare → 1Panel OpenResty(80/443) → 127.0.0.1:本端口。
      # 绑 0.0.0.0 等于多开一条绕过 Cloudflare 与 OpenResty 的直连通道，且直连方可自带
      # CF-Connecting-IP / X-Forwarded-For 换一个干净的限流桶（实测可伪造，后端日志照单全收）。
      # 入口代理走回环，收紧绑定不影响站点。
      - "127.0.0.1:${HTTP_PORT:-10100}:80"
    # nginx.conf 声明 worker_connections 16384，而容器默认 nofile 只有 1024：并发一上来
    # nginx 拿不到 socket，直接以 503（rt=0.000）拒掉新连接——压力下表现为"服务偶发不可用"。
    # 把软硬上限抬到与 worker_connections 匹配，并在 nginx -t 时不再有 ulimit 警告。
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      # 入口独立启动：网关只等上游容器存在（service_started），不等全部 healthy。
      # 冷启动/重建时单个存储或论坛服务不健康不再阻塞整个入口（2026-09 审计 O02）：
      # 公开目录仍可访问，故障只影响对应路由（按路由降级，各 location 的上游超时与
      # 502 只落在该前缀）。逐上游就绪探针见 nginx.conf 的 /health/<service>。
      backend:
        condition: service_started
      auth:
        condition: service_started
      community:
        condition: service_started
      storage:
        condition: service_started
      mcp:
        condition: service_started
      frontend:
        condition: service_started
      docs-site:
        condition: service_started
    networks:
      - metafusion-net

  mcp:
    logging: *default-logging
    build:
      context: ${MF_MCP_DIR:-../../metafusion-mcp}
      dockerfile: Dockerfile
    image: metafusion-mcp:${METAFUSION_TAG:-local}
    container_name: metafusion-mcp
    restart: unless-stopped
    environment:
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-https://findverse.cc}
      - MCP_API_URL=http://gateway
      - MCP_AUTH_URL=http://auth:8081
      - MCP_DATABASE_URL=${MCP_DATABASE_URL:-}
      - MCP_ENCRYPTION_KEY=${MCP_ENCRYPTION_KEY:-}
      - MCP_SKILLS_REVISION=${MCP_SKILLS_REVISION:-}
      - MCP_DOCS_REVISION=${MCP_DOCS_REVISION:-}
      - MCP_OBJECT_ORIGINS=${MCP_OBJECT_ORIGINS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - MCP_SEARCH_PROVIDER=${MCP_SEARCH_PROVIDER:-duckduckgo}
      - MCP_SEARCH_URL=${MCP_SEARCH_URL:-}
      - MCP_SEARCH_API_KEY=${MCP_SEARCH_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # 显式初始化 MCP schema；运行服务仅持有 mcp schema 的 CRUD 权限。
  mcp-migrate:
    logging: *default-logging
    image: metafusion-mcp:${METAFUSION_TAG:-local}
    profiles: ["tools"]
    command: ["-migrate"]
    environment:
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-https://findverse.cc}
      - MCP_API_URL=http://gateway
      - MCP_AUTH_URL=http://auth:8081
      - MCP_DATABASE_URL=${MCP_MIGRATION_DATABASE_URL:-}
      - MCP_ENCRYPTION_KEY=${MCP_ENCRYPTION_KEY:-}
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 1. 前端应用 (Next.js 16 — 见 frontend/package.json，含 /admin 管理后台)
  #    调用都是同源 /api/*，由网关分流，前端不感知服务拆分。
  # --------------------------------------------------------------------------
  frontend:
    logging: *default-logging
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* 是**构建期内联**：必须在 build 阶段传，运行期 environment 无效。
      # 留空即前端按同源网关路径工作（当前部署形态）；要指向外部服务域名再填。
      args:
        NEXT_PUBLIC_RESOURCE_STATION_URL: ${NEXT_PUBLIC_RESOURCE_STATION_URL:-}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-}
    container_name: metafusion-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 2. 全量文档站 (VitePress SSG + sirv-cli)，经网关 /docs 反代
  #    内容在独立仓库 metafusion-docs（唯一源）。默认按"与主仓库并列检出"解析（../../），
  #    可用 MF_DOCS_DIR 改成任意布局（例如全部放在主仓库内的 services/ 下）。
  # --------------------------------------------------------------------------
  docs-site:
    logging: *default-logging
    build:
      context: ${MF_DOCS_DIR:-../../metafusion-docs}
      dockerfile: Dockerfile
    container_name: metafusion-docs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 3. 元数据目录 (Go) — 收紧为只负责实体/关系/检索等目录职责
  #    账号、互动、存储已由独立服务承载，因此这里不再持有 ARCHIVE_*/S3 变量与
  #    归档卷：职责与数据都不复制（迁移基准第 3 节）。
  # --------------------------------------------------------------------------
  # backend 健康检查：/ready 需 postgres 可达（见 cmd/server/main.go）。
  backend:
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: server
      # /api/version 的版本身份：只有构建期注入才靠得住（镜像里没有 .git，运行期读环境变量
      # 会随重启漂移）。deploy.sh 构建前把当前提交导出成 METAFUSION_GIT_SHA，CI 的镜像矩阵
      # 传 GITHUB_SHA；两者都没有时是 unknown——宁可显式未知，也不要猜一个版本。
      args:
        GIT_SHA: ${METAFUSION_GIT_SHA:-unknown}
        APP_VERSION: ${METAFUSION_VERSION:-unknown}
    image: metafusion-backend:${METAFUSION_TAG:-local}
    container_name: metafusion-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      # 生产不开 gin 的 debug 模式：debug 下每次启动会把整份路由表打进日志，并给每个请求
      # 附 [GIN-debug] 明细（等于把未公开端点清单写进日志、也把日志撑大）。release 只关掉这些
      # debug 输出，gin.Logger() 的逐请求访问日志与格式不变，排障字段照旧。
      - GIN_MODE=release
      - PORT=8080
      # 每服务独立角色的 DSN（数据层隔离，见 docs/architecture/database-roles.md）。
      # 本容器只持有这一条 DSN：DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME 等共用身份
      # 刻意不再注入（2026-09 审计 O01）——进程环境一旦持有管理凭据，SQL 层隔离即被绕过。
      # 运行服务只接受本域 DSN，管理身份只用于迁移作业。
      - DATABASE_URL=${CATALOG_DATABASE_URL:?CATALOG_DATABASE_URL must be set}
      - CATALOG_DB_MAX_OPEN_CONNS=${CATALOG_DB_MAX_OPEN_CONNS:-64}
      - CATALOG_DB_MAX_IDLE_CONNS=${CATALOG_DB_MAX_IDLE_CONNS:-32}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-}
      - CATALOG_OUTBOX_RETENTION_DAYS=${CATALOG_OUTBOX_RETENTION_DAYS:-7}
      - CATALOG_RETENTION_INTERVAL_SECONDS=${CATALOG_RETENTION_INTERVAL_SECONDS:-3600}
      # OpenSearch 是正式文本查询服务；外部集群可覆盖 URL 和认证。
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME:-}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-}
      # /api/capabilities 是"部署态"声明：能力在不在由这几个变量决定（capabilities/subsystems 的 envKey）。
      # 目录不探测上游、不发任何出站请求；不配的能力会被判为未部署，前端按 enabled 隐藏入口。
      # 互动（论坛/短评/收藏/私信）由同一个互动服务承载，因此只有一条 community 声明。
      - COMMUNITY_URL=http://community:8083
      - STORAGE_URL=http://storage:8082
      - STORAGE_CATALOG_LIFECYCLE_SECRET=${STORAGE_CATALOG_LIFECYCLE_SECRET:-}
      # 目录只验签、不签发：优先静态公钥，其次账号服务的 JWKS；都没有时验签器不可用（fail closed）。
      # 私钥只属于账号服务——目录**不再需要** AUTH_JWT_PRIVATE_KEY，因此这里不再注入。
      # 切换窗口：公钥与 JWKS 都没配时，目录的写接口会一律按未登录处理（fail closed，不会静默放行）。
      - AUTH_JWT_PUBLIC_KEY=${AUTH_JWT_PUBLIC_KEY:-}
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://auth:8081/api/oidc/jwks}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
      # 个人访问令牌（PAT，mfp_ 前缀）的内省地址：目录不签发、不读账号库，带 mfp_ 的请求交给
      # 账号服务的内省端点判定（结果进程内缓存 60 秒 → 吊销最长 60 秒生效）。
      # 不配这个变量时 PAT 请求一律 503 auth_unavailable，而不是 401——401 会让 bot/CI
      # 以为凭据有问题去换令牌，而实际是这条依赖没接上。
      - AUTH_URL=http://auth:8081
      # 应用层限流与审计要按**真实客户端 IP**：只信任显式来源（默认回环 + RFC1918 私网 = 网关容器
      # 所在网段）。语义与安全边界见 backend/internal/nettrust（四个服务同一份实现）。留空即默认值；
      # 非法值会让服务**拒绝启动**——静默退回"无可信代理"会让限流重新退化成全站共享一个桶。
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # 站内通知的跨服务投递密钥（互动服务 → 目录，见 backend/internal/catalog/notifications_http.go）。
      # 留空 = 目录侧的投递端点整体 503 internal_api_disabled、互动侧不投递：评论与回帖照常成功，
      # 只是不产生通知（部署态可见、可排查），而不是"任何登录用户都能给任何人塞通知"。
      # 两个服务必须**同值**：不一致时表现为互动侧投递 401 invalid_internal_token 的日志。
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 4. 账号服务 (metafusion-auth) — 注册/登录、会话、RS256 令牌签发与吊销、OAuth2/OIDC
  #    自有 auth schema；issuer/audience/私钥必须与目录侧完全一致，否则存量令牌全部失效。
  # --------------------------------------------------------------------------
  auth:
    logging: *default-logging
    build:
      context: ${MF_AUTH_DIR:-../../metafusion-auth}
      dockerfile: Dockerfile
    image: metafusion-auth:${METAFUSION_TAG:-local}
    container_name: metafusion-auth
    restart: unless-stopped
    environment:
      # 同上：生产关掉 gin debug 的路由表与逐请求 debug 输出。
      - GIN_MODE=release
      - PORT=8081
      # 每服务独立角色的 DSN（数据层隔离，见 docs/architecture/database-roles.md）。
      # 本容器只持有这一条 DSN：DB_* 共用身份刻意不再注入（2026-09 审计 O01），
      # 留空即启动失败、不静默降级；生产**必须**填。本地开发见 backend 段的覆盖文件说明。
      # 角色由 deploy/sql/roles-least-privilege.sql 建立，口令与 AUTH_DATABASE_URL 同源。
      # 值的形状：postgres://mf_auth:<该角色口令>@postgres:5432/metafusion_db?sslmode=disable
      - DATABASE_URL=${AUTH_DATABASE_URL:?AUTH_DATABASE_URL must be set}
      # SSL 模式说明见 backend 段。账号库最敏感，跨网部署第一个要改就是这里。
      # 签发私钥是**必填**：留空时账号服务拒绝启动（不再静默生成进程内临时密钥——那会让
      # 每次重启都作废全部已签发令牌并换掉 JWKS，审计 S-9）。这里仍用 ":-" 而不是 ":?" 是刻意的
      # 选择：compose 层拦住会连带挡住不含 auth 的部署路径，让服务自己在日志里给出原因更直接；
      # 要提前拦就把它改成 ":?AUTH_JWT_PRIVATE_KEY must be set in .env"。
      - AUTH_JWT_PRIVATE_KEY=${AUTH_JWT_PRIVATE_KEY:-}
      # 本地开发开关：置为 1/true/yes/on 才允许进程内临时密钥（生产不要开，启动会打 WARNING）。
      - AUTH_JWT_ALLOW_EPHEMERAL_KEY=${AUTH_JWT_ALLOW_EPHEMERAL_KEY:-}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
      # 应用层限流与审计要按**真实客户端 IP**：只信任显式来源（默认回环 + RFC1918 私网 = 网关容器
      # 所在网段）。语义与安全边界见 backend/internal/nettrust（四个服务同一份实现）。留空即默认值；
      # 非法值会让服务**拒绝启动**——静默退回"无可信代理"会让限流重新退化成全站共享一个桶。
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
    # 服务镜像基于 alpine，只有 busybox wget 没有 curl；/ready 会 ping postgres，
    # 数据库不可达时返回 503，正好当健康判据。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # 账号 HTTP 启动只读检查；DDL 与用户名冲突检查使用独立结构身份。
  auth-migrate:
    logging: *default-logging
    image: metafusion-auth:${METAFUSION_TAG:-local}
    profiles: ["tools"]
    command: ["/app/auth-server", "-migrate"]
    environment:
      - DATABASE_URL=${AUTH_MIGRATION_DATABASE_URL:?AUTH_MIGRATION_DATABASE_URL must be set}
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 5. 互动服务 (metafusion-community) — 论坛、短评、收藏、互动记录
  #    自有 community schema；实体可见性问目录服务，不直连目录库。
  # --------------------------------------------------------------------------
  community:
    logging: *default-logging
    build:
      context: ${MF_COMMUNITY_DIR:-../../metafusion-community}
      dockerfile: Dockerfile
    image: metafusion-community:${METAFUSION_TAG:-local}
    container_name: metafusion-community
    restart: unless-stopped
    environment:
      # 同上：生产关掉 gin debug 的路由表与逐请求 debug 输出。
      - GIN_MODE=release
      - PORT=8083
      # 每服务独立角色的 DSN（数据层隔离，见 docs/architecture/database-roles.md）：
      # 本域独立 DSN 必填；运行服务不持有 DB_* 管理身份。
      # 仍共用同一个库用户 metafusion——任一服务被攻破即可读写全部数据（2026-09 审计 P0）。
      # 角色由 deploy/sql/roles-least-privilege.sql 建立，口令与 COMMUNITY_DATABASE_URL 同源。
      # 本容器只持有这一条 DSN：DB_* 共用身份刻意不再注入（2026-09 审计 O01），
      # 留空即启动失败、不静默降级；生产**必须**填。本地开发见 backend 段的覆盖文件说明。
      # 值的形状：postgres://mf_community:<该角色口令>@postgres:5432/metafusion_db?sslmode=disable
      - DATABASE_URL=${COMMUNITY_DATABASE_URL:?COMMUNITY_DATABASE_URL must be set}
      # auth 是唯一签发方，JWKS 指向账号服务（不再回指目录服务）。
      - COMMUNITY_JWKS_URL=http://auth:8081/api/oidc/jwks
      # 存量不透明会话令牌的兜底解析：身份问题只问账号服务（不查目录服务）。
      - AUTH_URL=http://auth:8081
      - CATALOG_URL=http://backend:8080
      # 站内通知的跨服务投递密钥（与 backend 段同一个键、**必须同值**）：见 backend 段的说明。
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      # 应用层限流与审计要按**真实客户端 IP**：只信任显式来源（默认回环 + RFC1918 私网 = 网关容器
      # 所在网段）。语义与安全边界见 backend/internal/nettrust（四个服务同一份实现）。留空即默认值；
      # 非法值会让服务**拒绝启动**——静默退回"无可信代理"会让限流重新退化成全站共享一个桶。
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 5b. 互动数据搬运工具（一次性）— 把主仓库旧表搬进 community.*
  #     forward：modules.forum_* / catalog.favorites → community.*
  #     back   ：反向搬运，仅用于"切流后还要退回单体"的回滚窗口。
  #     幂等（全部 ON CONFLICT DO NOTHING）、只读源表，可重复运行补增量。
  #     常驻编排不启动它（profiles: tools），只在切流窗口显式调用：
  #       docker compose run --rm community-migrate -direction forward -dry-run
  #       docker compose run --rm community-migrate -direction forward
  #     与 community 共用同一镜像，保证搬运逻辑与被部署的代码是同一份。
  # --------------------------------------------------------------------------
  community-migrate:
    logging: *default-logging
    build:
      context: ${MF_COMMUNITY_DIR:-../../metafusion-community}
      dockerfile: Dockerfile
    image: metafusion-community:${METAFUSION_TAG:-local}
    profiles: ["tools"]
    entrypoint: ["/app/community-migrate"]
    environment:
      # 一次性搬运工具：**需要跨域读的进程之一**（读 modules.* 与 catalog.favorites，
      # 写 community.*），因此它用独立的管理身份，不拿任何服务的运行角色——
      # 见 docs/architecture/database-roles.md 第 4 节。只给显式管理 DSN，
      # 不把数据库 owner 凭据作为缺省身份注入。
      - DATABASE_URL=${COMMUNITY_MIGRATE_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 5c. 目录库迁移作业（一次性）— migrator 镜像里的 /app/migrate，库 owner 身份。
  #     deploy.sh 的 migrate/up/first-boot 只走它，不再复用 backend 服务定义：
  #     backend 容器已不再持有 DB_*（审计 O01），用它跑迁移会拿到空身份。
  #     常驻编排不启动它（profiles: tools），只由 deploy.sh 调用：
  #       docker compose run --rm --no-deps backend-migrate up
  #     镜像身份（审计 §6）：本地构建用 metafusion-migrator（与 backend 同源 Dockerfile
  #     的 migrator 阶段，不是 server 阶段——server 镜像虽也含 /app/migrate，但那是
  #     运行态镜像，迁移必须与发布矩阵的 backend-migrator 同阶段）；
  #     pull/prod 路径由 docker-compose.prod.yml 覆盖为本次发布的 GHCR migrator 镜像
  #     （去 build，不本地构建）。两边是否同提交以 release-manifest.yaml 为准，
  #     digest 在部署机上用 docker buildx imagetools inspect 解析验证，不写死未经
  #     验证的值（写了等于伪造已验证版本）。
  #     seed / check-refs 显式任务也走它（deploy.sh seed/check-refs；cutover/prod/pull
  #     在迁移后自动跑 seed）：与服务启动时的隐式合并同一份逻辑，但显式跑失败即非零，
  #     部署后模板状态以这次为准，不再靠“重启过 = 种子合过”推测（S1 方向）。
  # --------------------------------------------------------------------------
  backend-migrate:
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: migrator
    image: metafusion-migrator:${METAFUSION_TAG:-local}
    profiles: ["tools"]
    entrypoint: ["/app/migrate"]
    environment:
      # 迁移/运维身份（库 owner）：业务容器拿不到的共用凭据只出现在这里
      # 不进任何常驻服务；community-migrate 使用自己的显式管理 DSN。
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-metafusion}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-metafusion_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 6. 存储服务 (metafusion-storage) — 物理文件、内容寻址、去重、绑定与下载
  #    自有 storage schema；元数据不落在这里（只按实体 id 问目录服务可见性）。
  # --------------------------------------------------------------------------
  storage:
    logging: *default-logging
    build:
      context: ${MF_STORAGE_DIR:-../../metafusion-storage}
      dockerfile: Dockerfile
    image: metafusion-storage:${METAFUSION_TAG:-local}
    container_name: metafusion-storage
    restart: unless-stopped
    environment:
      # 同上：生产关掉 gin debug 的路由表与逐请求 debug 输出。
      - GIN_MODE=release
      - PORT=8082
      # 每服务独立角色的 DSN（数据层隔离，见 docs/architecture/database-roles.md）：
      # 本域独立 DSN 必填；运行服务不持有 DB_* 管理身份。
      # 仍共用同一个库用户 metafusion——任一服务被攻破即可读写全部数据（2026-09 审计 P0）。
      # 角色由 deploy/sql/roles-least-privilege.sql 建立，口令与 STORAGE_DATABASE_URL 同源。
      # 本容器只持有这一条 DSN：DB_* 共用身份刻意不再注入（2026-09 审计 O01），
      # 留空即启动失败、不静默降级；生产**必须**填。本地开发见 backend 段的覆盖文件说明。
      # 值的形状：postgres://mf_storage:<该角色口令>@postgres:5432/metafusion_db?sslmode=disable
      - DATABASE_URL=${STORAGE_DATABASE_URL:?STORAGE_DATABASE_URL must be set}
      - STORAGE_ROOT=/app/storage-data
      # 上传与回读校验的上限：代码默认 0 = 不限制，编排必须显式收口，否则只剩网关
      # client_max_body_size 的 1 GiB 兜底（2026-09 审计 ops#30 / storage S24）。
      # 取值与网关对齐：上传上限 = 网关的 1024m；回读校验是 complete 阶段整份读回，
      # 超时就按 600s（= 网关 storage 段的 proxy_read_timeout）封顶，超限显式失败。
      - STORAGE_MAX_UPLOAD_MB=${STORAGE_MAX_UPLOAD_MB:-1024}
      - STORAGE_VERIFY_MAX_MB=${STORAGE_VERIFY_MAX_MB:-1024}
      - STORAGE_VERIFY_TIMEOUT_SECONDS=${STORAGE_VERIFY_TIMEOUT_SECONDS:-600}
      # 容量与并发预算（A02 兑现后的治理旋钮）：服务默认 0/72/7 = 不限制，与当前行为一致；
      # 先看 GET /api/storage/stats 再定值。超限 initiate 回 413，并发超限回 429。
      - STORAGE_USER_QUOTA_MB=${STORAGE_USER_QUOTA_MB:-0}
      - STORAGE_SITE_QUOTA_MB=${STORAGE_SITE_QUOTA_MB:-0}
      - STORAGE_USER_CONCURRENT_UPLOADS=${STORAGE_USER_CONCURRENT_UPLOADS:-0}
      - STORAGE_SITE_CONCURRENT_UPLOADS=${STORAGE_SITE_CONCURRENT_UPLOADS:-0}
      - STORAGE_PENDING_TTL_HOURS=${STORAGE_PENDING_TTL_HOURS:-72}
      - STORAGE_ORPHAN_RETENTION_DAYS=${STORAGE_ORPHAN_RETENTION_DAYS:-7}
      - STORAGE_CATALOG_LIFECYCLE_SECRET=${STORAGE_CATALOG_LIFECYCLE_SECRET:-}
      - STORAGE_UNBOUND_RETENTION_DAYS=${STORAGE_UNBOUND_RETENTION_DAYS:-7}
      - STORAGE_S3_ENDPOINT=http://rustfs:9000
      - STORAGE_S3_TLS=false
      # 对象存储凭据（RustFS 的 root 用户/口令）的唯一来源；服务侧只认 S3 协议，与具体实现无关。
      # 读取方只有 metafusion-storage（internal/config 的 STORAGE_S3_ACCESS_KEY/_SECRET_KEY）
      # 与备份作业（scripts/backup.sh，经 .env 的 RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY）；目录/账号/互动三个容器
      # 永不注入 S3 凭据。RustFS 当前是单 root 用户，这组别名即最小可用凭据（审计 O01）；
      # 桶级作用域密钥待对象存储支持 IAM 后再切，届时这里只换值、不加接收方。
      # 对象存储容器自己读的是 RUSTFS_*，见下面服务 10。
      - STORAGE_S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY must be set in .env}
      - STORAGE_S3_SECRET_KEY=${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set in .env}
      - STORAGE_S3_BUCKET=metafusion-master
      # 最小权限切换口（默认 false = 现状：root 凭据 + 服务自建桶，见上面对象存储凭据注释）。
      # 切到仅目标桶服务凭据的那次部署，才把这里改 true，且桶必须已由运维身份事先建好，
      # 同时把上面两项换成服务用户凭据。两步必须同一次部署完成，不可只改一半。
      - STORAGE_S3_SKIP_BUCKET_ENSURE=${STORAGE_S3_SKIP_BUCKET_ENSURE:-false}
      # 最小权限切换口（默认 false = 现状：root 凭据 + 服务自建桶，见上面对象存储凭据注释）。
      # 切到仅目标桶服务凭据的那次部署，才把这里改 true，且桶必须已由运维身份事先建好，
      # 同时把上面两项换成服务用户凭据。两步必须同一次部署完成，不可只改一半。
      # 预签名直传的地址必须浏览器可达（SigV4 覆盖 Host）；本编排不把对象存储
      # 端口发到宿主机，留空即沿用内部端点，此时浏览器直传改走
      # PUT /api/storage/upload/stream/{asset_id} 的服务端流式上传。
      - STORAGE_S3_PUBLIC_ENDPOINT=${STORAGE_S3_PUBLIC_ENDPOINT:-}
      - STORAGE_JWKS_URL=http://auth:8081/api/oidc/jwks
      # 存量不透明会话令牌的兜底解析：身份问题只问账号服务（不查目录服务）。
      - AUTH_URL=http://auth:8081
      - CATALOG_URL=http://backend:8080
      # 应用层限流与审计要按**真实客户端 IP**：只信任显式来源（默认回环 + RFC1918 私网 = 网关容器
      # 所在网段）。语义与安全边界见 backend/internal/nettrust（四个服务同一份实现）。留空即默认值；
      # 非法值会让服务**拒绝启动**——静默退回"无可信代理"会让限流重新退化成全站共享一个桶。
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    volumes:
      # 本地对象模式根目录与直传暂存目录，与目录侧的归档卷无关。
      - storage_data:/app/storage-data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      # 桶由存储服务在启动时自己建（internal/objects ensureBucket），
      # 因此不再需要一次性初始化容器，也就没有"桶没建好就启动"这一类顺序故障。
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 6a. 存储清理 worker（一次性任务容器，与 storage 同镜像同环境，跑一次退出）。
  #     profiles 隔离：日常 up 不会启动它；显式 docker compose --profile maintenance
  #     run --rm storage-worker 触发（A01 认领可重试；定时触发见运维 timer/cron）。
  #     自动删除型清理在并发保护验收前保持手工触发（审计 A01 建议）。
  storage-worker:
    logging: *default-logging
    build:
      context: ${MF_STORAGE_DIR:-../../metafusion-storage}
      dockerfile: Dockerfile
    image: metafusion-storage:${METAFUSION_TAG:-local}
    profiles: ["maintenance"]
    command: ["worker"]
    environment:
      - DATABASE_URL=${STORAGE_DATABASE_URL:?STORAGE_DATABASE_URL must be set}
      - STORAGE_ROOT=/app/storage-data
      - STORAGE_S3_ENDPOINT=http://rustfs:9000
      - STORAGE_S3_TLS=false
      - STORAGE_S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY must be set in .env}
      - STORAGE_S3_SECRET_KEY=${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set in .env}
      - STORAGE_S3_BUCKET=metafusion-master
      - STORAGE_S3_SKIP_BUCKET_ENSURE=${STORAGE_S3_SKIP_BUCKET_ENSURE:-false}
      - CATALOG_URL=http://backend:8080
    volumes:
      - storage_data:/app/storage-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 6b. 三个服务自带的管理台（独立应用；决议见解耦审计 §7.3 与
  #     docs/architecture/service-split-migration.md 第 2 节）
  #     为什么独立构建与独立发布：管理台是各服务自己仓库里的 `admin/` 应用（构建上下文取该仓库），
  #     镜像不出现在主仓库的发布矩阵里；某个服务改一个字段就重发它自己的管理台，不必占用主前端的发布窗口。
  #     网关按 `^/admin/(account|community|storage)/` 三条前缀聚合，三条 location 见 deploy/nginx.conf。
  #     刻意不给健康门控：网关对它们的探活是 /admin/<域>/api/health（应用自己的端点），
  #     所以这里用最轻的 depends_on 列表形式——管理台与域 API 并列，不参与网关开门的判据。
  #     image 命名随 frontend（就地构建、不写死名字）：构建上下文是兄弟仓库，主仓库的 CI 构不到它。
  #     不写 healthcheck：三个 admin/Dockerfile 的基础镜像不保证带 wget/curl，
  #     编排层探活会得到"永远 unhealthy"的假象；健康交给网关路径与运维侧的 curl。
  # --------------------------------------------------------------------------
  auth-admin:
    logging: *default-logging
    build:
      context: ${MF_AUTH_DIR:-../../metafusion-auth}
      dockerfile: admin/Dockerfile
    container_name: metafusion-auth-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - auth
    networks:
      - metafusion-net

  # 账号自助应用（登录/注册/初始化；与管理台同模式：兄弟仓库 user/ 目录独立构建，
  # 网关用 = /login、= /setup 精确路径聚合。不写 healthcheck、不进网关开门判据，
  # 理由同上 6b 节：健康由网关路径 /login（应用自己的页面）与运维侧 curl 判定。
  auth-user:
    logging: *default-logging
    build:
      context: ${MF_AUTH_DIR:-../../metafusion-auth}
      dockerfile: user/Dockerfile
    container_name: metafusion-auth-user
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - auth
    networks:
      - metafusion-net

  community-admin:
    logging: *default-logging
    build:
      context: ${MF_COMMUNITY_DIR:-../../metafusion-community}
      dockerfile: admin/Dockerfile
    container_name: metafusion-community-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - community
    networks:
      - metafusion-net

  storage-admin:
    logging: *default-logging
    build:
      context: ${MF_STORAGE_DIR:-../../metafusion-storage}
      dockerfile: admin/Dockerfile
    container_name: metafusion-storage-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - storage
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 7. 主关系数据库 (PostgreSQL 16) — 各服务共用实例、独立 schema
  # --------------------------------------------------------------------------
  postgres:
    logging: *default-logging
    image: postgres:16.15-alpine
    # 并行 VACUUM/查询使用动态共享内存；Docker 默认 64m 在维护时可能耗尽。
    shm_size: 256m
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-512}"]
    container_name: metafusion-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-metafusion}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${DB_NAME:-metafusion_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-metafusion} -d ${DB_NAME:-metafusion_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 8. 全文与多维聚合搜索引擎 (OpenSearch 2.19)
  #    正式文本查询服务；PostgreSQL outbox 补建/增量更新。默认随本栈启动。
  #    存量 opensearch_data 卷保留。
  # --------------------------------------------------------------------------
  opensearch:
    logging: *default-logging
    image: opensearchproject/opensearch:2.19.7
    container_name: metafusion-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 10. S3 兼容对象存储 (RustFS) — 只在 metafusion-net 内可达，不发布宿主机端口
  # --------------------------------------------------------------------------
  # 镜像 pin（审计 O05，fail closed）：RUSTFS_IMAGE 必须显式设置，未设置 compose 直接
  # 拒绝解析，不再回退上游浮动标签（回退等于把“跑的是哪版对象存储”交给运维当天的网络）。
  # 生产钉到 digest（例：RUSTFS_IMAGE=rustfs/rustfs:1.75.0@sha256:<digest>）。
  # digest 查询法（在能拉镜像的机器上，不要编造值）：
  #   docker buildx imagetools inspect rustfs/rustfs:<tag>   # 取 RepoDigests 填进来
  # 填入后验证存储服务仍能连上、桶仍能自动创建再提交；在 digest 落定前不要把某个未经
  # 验证的版本号写成默认值——那等于虚构“已验证”。
  # 联动：本变量已记入根目录 .env.example 占位示例（check_deploy.py 的必填登记检查可过），
  # CI compose-lint 的三个 base 合并步骤也在 env 里给了 rustfs/rustfs:test-only 假值
  # （config 只做插值不拉镜像）——干净 runner 可过解析，见 .github/workflows/ci.yml。
  rustfs:
    logging: *default-logging
    image: ${RUSTFS_IMAGE:?RUSTFS_IMAGE must be set in .env (pin to digest, see above)}
    container_name: metafusion-rustfs
    restart: unless-stopped
    environment:
      # 这两行只给 rustfs 容器自己读（canonical 名，源码里是 ENV_RUSTFS_ACCESS_KEY /
      # ENV_RUSTFS_SECRET_KEY）；本仓库的 Go 代码都不读 RUSTFS_* —— 目录服务只读 DATABASE_URL/OPENSEARCH_*/PORT/
      # AUTH_*，存储服务读上面的 STORAGE_S3_*。
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY must be set in .env}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set in .env}
      - RUSTFS_STORAGE_DIR=/data
    volumes:
      - s3_data:/data
    networks:
      - metafusion-net

networks:
  metafusion-net:
    driver: bridge

volumes:
  pg_data:
  # 索引卷独立于 PostgreSQL，可由目录事实重建。
  opensearch_data:
  s3_data:
  storage_data:
  nginx_logs:
