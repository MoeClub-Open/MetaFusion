user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 与资源上传接口的请求体上限一致；JSON 写入仍受应用层更小的限制。
    client_max_body_size 1024m;

    # 安全基线响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS：本栈只 listen 80，TLS 由 Cloudflare 终结，而浏览器只在 HTTPS 响应上认这条头
    # （RFC 6797 §8.1：经非安全传输收到的 HSTS 必须忽略）。要真正生效得两半都在：源站发出它，
    # CF 再透传或由 CF 面板下发。实测同层级的五条基线头能原样穿过 CF 到达浏览器
    # （https://findverse.cc/ 的响应里 x-frame-options 等五条都在），故这里如实发头；
    # CF 面板若另行开启 HSTS，浏览器拿到的是面板那份配置，以面板为准（CF 是唯一对外 TLS 端点）。
    # 不加 preload：那是把域名写进浏览器内置列表、撤回要等数月的一次性承诺，且要求所有子域
    # 长期可 HTTPS。本域当前只有 www 一个子域且已是 HTTPS，先不打这张不可逆的牌。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP 先上 Report-Only：Next.js 每个 SSR 页面都带内联 hydration 载荷（self.__next_f.push）、
    # React 主题切换写 style 属性，直接强制会打挂首屏，所以这一版只观察、不阻断。
    # 统一挂在 http 级而不是逐 location：location 级只要出现 add_header 就会整体取代这组头
    # （同一个坑见本文件 /uploads 退役那条注释与 nginx.metadata.conf 的 server 段），
    # 逐路径下发反而会让基线头静默消失。代价是 /api/* 的 JSON 也带这条头，浏览器只在文档上解析它。
    # 取值来自实测资源：脚本与样式全部同源（/_next/static/*、/theme-boot.js、VitePress 内联块），
    # 封面是目录里任意远端 https 图片（<img src> 直引，不走 next/image，白名单列不全），存储预览走 blob:；
    # 站内没有 <video>/<audio>，media-src 只留同源与 blob。
    # 切强制前必须做：把 script-src 的 'unsafe-inline' 换成 nonce/hash（Next middleware 下发），
    # 并逐应用（主前端 / 三个管理台 / 文档站）核对——这一步不能在网关做，网关拿不到各应用的内联哈希。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

    # 强制版 CSP：只放当前就能安全生效的四条——它们与脚本/样式来源无关，不会打挂任何应用的
    # 首屏（object-src 关插件、base-uri 防 <base> 劫持、frame-ancestors 防被嵌、form-action 防
    # 表单外发）。两条 CSP 头并存时浏览器**各自独立执行**，强制这份不含 script-src/style-src，
    # 所以只收紧这四点；script-src 仍在上面那份 Report-Only 里观察，等 nonce/hash 就绪再合并。
    # 与已有的 X-Frame-Options: SAMEORIGIN 不冲突（frame-ancestors 是它的现代替代，语义一致）。
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # 真实客户端 IP：公网入口是 Cloudflare，但**直连本容器的是 1Panel OpenResty**
    # （host 网络，80/443 → 127.0.0.1:${HTTP_PORT}），容器看到的对端是网桥网关，不是 CF 节点。
    # 因此下面那 22 条 CF 网段永远匹配不上对端，$remote_addr 恒为网桥网关——不还原真实 IP 时
    # 按 $binary_remote_addr 计数的认证保护 auth_limit 全站共用一个桶，
    # access.log 里也只剩网关地址。
    # 真实对端必须显式加进信任表（实测 172.28.0.1；不同 docker 网络需按实际网关调整）。
    # 只写这一个地址，**不要**写 172.16.0.0/12：同一网段还挂着 backend/auth/storage/frontend
    # 等 14 个容器，信任整个私网段等于让任一被攻破的服务都能伪造 CF-Connecting-IP 换取新桶。
    # 前置条件：网关端口绑 127.0.0.1（见 docker-compose.yml）；OpenResty 必须仅接受 Cloudflare
    # 来源，并覆盖直连请求的 CF-Connecting-IP。宿主进程拥有本机信任，仍可声明这个头；回环绑定
    # 不能把宿主来源证明成 Cloudflare。部署时必须实测伪造头不能经公网入口换桶。
    set_real_ip_from 172.28.0.1;
    # 以下网段供其它部署形态（Cloudflare 直连本机）使用；来源
    # https://www.cloudflare.com/ips-v4 与 /ips-v6（2026-09-18 抓取，CF 会增补，
    # 变更后需要同步这里；同步脚本化属于后续工作）。
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # CF 的客户端地址头；real_ip_recursive 保持默认 off（该头是单值，没有链要回溯）。
    real_ip_header CF-Connecting-IP;


    # 上游看到的协议（X-Forwarded-Proto）：本栈只 listen 80、TLS 由 Cloudflare 终结，因此 $scheme
    # 恒为 http。直接把它转给上游，账号服务的会话 Cookie 判定（handler.isSecure：TLS 或
    # X-Forwarded-Proto == https）在生产上永远为假 —— 登录/刷新响应的 Set-Cookie **不带 Secure**，
    # 会话 Cookie 可以被明文 HTTP 请求带走（审计 P0）。
    # 取值优先级（map 的正则按书写顺序匹配，先命中生效；组合成一个字符串判定，避免多张 map 串联的优先级歧义）：
    #   1. CF-Visitor（CF 写下的 {"scheme":"https"}）：与 real_ip 依赖 CF-Connecting-IP 是同一套信任
    #      模型 —— 只在对端确实是 CF 边缘时可信，客户端自带的同名头由 CF 覆盖，直连源站伪造它只会
    #      把协议"说成 https"（更严格的方向，不构成降级）；
    #   2. 上游头 X-Forwarded-Proto：前置反代自己带头的部署（CF 之外的接入方式）。两条上游头
    #      规则都锚定到"整段取值恰好是 https/http"（$ 收尾）：多值/带逗号的取值一律退到 $scheme，
    #      避免"客户端注入 + 代理追加"出来的 http, https 被当成裸 http 而丢掉 Secure；
    #   3. 都缺席时回退 $scheme：开发环境 http 直连（http://localhost:8080、内网探针、compose 里的
    #      健康检查）不会被误判成 https，Cookie 仍按明文下发 —— 与改动前一致，开发不被误伤。
    # 正则里刻意不出现花括号：CI 只挂本文件跑 nginx -t，仓库的括号配平检查按文本配对。
    map "$http_cf_visitor $http_x_forwarded_proto" $mf_forwarded_proto {
        default                       $scheme;
        "~*\"scheme\":\s*\"https\""   https;
        "~*\"scheme\":\s*\"http\""    http;
        "~*^[^ ]* https$"             https;
        "~*^[^ ]* http$"              http;
    }

    # 未验证凭据的登录/注册/刷新/安装/令牌接口由边缘独立保护。
    # 业务额度在服务验证身份后计数，云端 MCP 共享出口和 admin 不进入这个 IP 桶。
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 配置 Docker 内置 DNS 解析器，设定 short TTL 防止上游容器重启/重建后 IP 变更导致 502 Bad Gateway
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name localhost _;

        location = /mcp {
            set $mcp_upstream "http://mcp:8084";
            proxy_pass $mcp_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
        location ^~ /mcp/ {
            set $mcp_upstream "http://mcp:8084";
            proxy_pass $mcp_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
            proxy_read_timeout 600s;
        }
        location = /.well-known/oauth-protected-resource/mcp {
            set $mcp_upstream "http://mcp:8084";
            proxy_pass $mcp_upstream;
        }
        location = /.well-known/oauth-authorization-server/mcp/oauth {
            set $mcp_upstream "http://mcp:8084";
            proxy_pass $mcp_upstream;
        }
        location = /health/mcp {
            set $mcp_upstream "http://mcp:8084";
            proxy_pass $mcp_upstream/ready;
        }

        # ----------------------------------------------------------------------
        # 路由矩阵：每个前缀只有一行 set $x_upstream，切流/回滚只改这一行。
        # 归属以 docs/architecture/service-split-migration.md 第 2 节为准；本文件就是网关的
        # 唯一生效矩阵（compose 把它挂进 gateway 容器），metafusion-api-gateway 仓库只留切流自检脚本。
        # 一律用变量 proxy_pass（配合上面的 resolver），上游重建换 IP 也不会 502。
        # 注意：此处不能拆 include —— CI 只挂载本文件跑 nginx -t。
        # 限流约定：仅下面五个未验证凭据的精确路径使用 auth_limit；其余业务不叠加 IP 桶。
        # scripts/check_gateway_matrix.py 检查认证保护必需、业务 IP 桶禁止与真实 IP 信任边界。
        # ----------------------------------------------------------------------

        # 退役占位：预览改走 /api/storage/* 的资源鉴权，网关不再直代私有桶。
        # 保留这条 location 是让旧客户端拿到明确的 404，而不是被 location / 兜到前端拿回 HTML。
        location /storage/preview/ {
            return 404;
        }

        # 内部生命周期投递只允许容器间调用，不向公网转发。
        location = /internal {
            return 404;
        }
        location ^~ /internal/ {
            return 404;
        }

        # === 1. 账号服务 (auth:8081)：/api/auth|/api/setup|/api/admin/users|
        #        /api/oauth|/api/developer|/api/oidc|/.well-known。
        #        令牌只由 auth 签发，其余服务只验签，因此 discovery 与 JWKS 全部归这里。 ===

        location = /api/auth/login {
            limit_req zone=auth_limit burst=20 nodelay;
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /api/auth/register {
            limit_req zone=auth_limit burst=20 nodelay;
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /api/auth/refresh {
            limit_req zone=auth_limit burst=20 nodelay;
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /api/oauth/token {
            limit_req zone=auth_limit burst=20 nodelay;
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location /api/auth/ {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /api/setup {
            limit_req zone=auth_limit burst=20 nodelay;
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # OAuth 客户端管理：/api/admin/oauth/*（/api/admin/* 与目录侧共前缀，必须显式指向 auth，
        # 否则会落到目录服务返回 404）。目录服务里没有任何 /api/admin/oauth* 端点，不会抢路由。
        location /api/admin/oauth/ {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # 前缀匹配同时覆盖 /api/admin/users/{id}/role|password
        location /api/admin/users {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # 账号域的 /api/admin/*：权限组、权限码、实例设置、邀请码。它们与目录侧的
        # /api/admin/*（货架、外部库、定义…）共前缀，必须逐个精确匹配——
        # 否则会落到目录服务，表现为 404（前端会以为接口不存在）。
        location = /api/admin/groups {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location ~ ^/api/admin/groups/[^/]+$ {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /api/admin/permissions {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /api/admin/settings {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /api/admin/invites {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # 审计读取面：跨服务审计表（audit.audit_log）的唯一读取端点，归账号服务。
        # 必须显式指向 auth：/api/admin/* 与目录侧共前缀，落到目录服务会变成 404。
        location = /api/admin/audit-logs {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }
        location ~ ^/api/admin/invites/[^/]+/revoke$ {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # 开发者中心：/api/developer/*（应用自助登记、接入配置与 scope 说明）。
        # 与管理面 /api/admin/oauth/* 分开：前者任何登录账号可用，后者要求 auth.oauth.manage。
        location /api/developer/ {
            # 开发者中心：任何登录账号可用，属账号域但页面会并发拉列表与详情，
            # 故沿用 auth_limit 而把 burst 放大到 20（5r/s 的均值对正常使用足够）。
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location /api/oauth/ {
            # 授权码与令牌端点：按凭据猜测的敏感接口对待，沿用 auth_limit。
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location /api/oidc/ {
            # JWKS 与 OIDC 端点：流量低但可被刷，沿用 auth_limit（签名公钥轮换时客户端才会重取）。
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # issuer 基址是 https://findverse.cc/api，discovery 挂在 /api/.well-known 下；
        # 根路径 /.well-known/ 是 OIDC 标准入口，两条都指向账号服务。
        location /api/.well-known/ {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location /.well-known/ {
            # OIDC 标准入口，属账号域，与 /api/.well-known/ 同口径。
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # === 2. 互动服务 (community:8083)：论坛、短评、收藏、互动记录 ===

        location /api/community/ {
            # Business rate limits are enforced after verified service authentication.
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location /api/favorites/ {
            # Business rate limits are enforced after verified service authentication.
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # `/api/users/*` 是**同一前缀、多个归属**：收藏与互动统计归互动服务、公开资料归账号服务、
        # 两段式的贡献列表归目录服务。三条正则各自锚定，不匹配的落目录服务兜底。
        location ~ ^/api/users/[^/]+/favorites$ {
            # Business rate limits are enforced after verified service authentication.
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # 公开账号资料归账号服务：`/api/users/<id>` 恰好一段路径。
        # 两段式的 `/api/users/<id>/contributions` 不匹配这里，继续走目录服务兜底。
        location ~ ^/api/users/[^/]+$ {
            # Business rate limits are enforced after verified service authentication.
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # 用户互动统计归互动服务：`/api/users/<id>/stats`（主题/回复/收藏计数）。
        location ~ ^/api/users/[^/]+/stats$ {
            # Business rate limits are enforced after verified service authentication.
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # 私信归互动服务：`/api/messages/with/<id>`（读写同一对用户之间的消息）。
        location /api/messages/ {
            # Business rate limits are enforced after verified service authentication.
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # === 3. 存储服务 (storage:8082)：文件直传、下载、绑定、哈希校验。
        #        限流按请求数计、与字节数无关，而分片上传天然是多请求，因此 burst 放大到 100：
        #        只拦异常刷量，不掐正常分片；缓冲关闭与超时放宽照旧。 ===

        location /api/storage/ {
            # Business rate limits are enforced after verified service authentication.
            proxy_request_buffering off;
            proxy_buffering off;
            set $storage_upstream "http://storage:8082";
            proxy_pass $storage_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # === 4. 元数据目录 (backend:8080)：其余 /api/* 与图片上传。
        #        旧前缀 /api/archive|playback|media 已随 P4 退役（存储契约是
        #        /api/storage/*，前端不调用旧前缀），故不再单列 location。 ===

        # /uploads/* 已退役：目录服务不再托管静态文件（后端路由里没有该前缀），前端也不再引用它
        # （全仓 grep 只命中注释本身），封面改为实体 DTO 里的远端 URL。故不再单列 location——
        # 该 location 曾经自带 add_header，会把 http 级的 nosniff/X-Frame-Options 安全头一并丢掉。

        # 其余 REST 与 WebSocket API 路由
        location /api/ {
            proxy_request_buffering off;
            # Business rate limits are enforced after verified service authentication.
            set $backend_upstream "http://backend:8080";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # === 6. 探针矩阵 ===
        # 旧写法是一条正则把 /healthz|livez|ready|live|health 全转给目录服务，注释却说是
        # "网关自身探针"——口径与实现不符（目录也没有 /health）。现在拆成三类：
        #   ① 网关自身存活：/healthz、/livez、/live，只证明 nginx 进程在跑；
        #   ② 逐上游就绪：/health/<service>，谁不健康一眼能看出，不再被一条路径掩盖；
        #   ③ 兼容旧路径：/ready 与 /health 仍指目录服务，行为与拆分前一致。
        # 全部用 "location =" 精确匹配：这样 proxy_pass 带 URI 的替换结果无歧义（结果就是 /ready 或 /health）。

        # ① 网关自身存活（不给上游、不探上游）
        location = /healthz {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"live","service":"metafusion-gateway"}';
        }

        location = /livez {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"live","service":"metafusion-gateway"}';
        }

        location = /live {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"live","service":"metafusion-gateway"}';
        }

        # ② 逐上游就绪：目录只有 /ready（含 postgres 连通判定）；账号/互动/存储同时有
        #    /health（进程存活）与 /ready（含 postgres），这里统一取 /ready，语义一致。
        #    **②③ 两段的 proxy_pass 末尾都带 $is_args$args**：它们用的是变量上游（$xxx_upstream）
        #    且带 URI，而 nginx 只在"proxy_pass 不带变量"时才自动附上原始 query —— 少了它，
        #    ?deep=1 会被静默丢掉（网关访问日志里有、上游收到没有）：v0.3.0 上线时实测就是
        #    "直连 :8080 有 upstreams 明细、经网关只剩浅探针响应体"，深探针这个降级可见性入口
        #    等于只在容器里可用。
        location = /health/catalog {
            set $backend_upstream "http://backend:8080";
            proxy_pass $backend_upstream/ready$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /health/auth {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream/ready$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /health/community {
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream/ready$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /health/storage {
            set $storage_upstream "http://storage:8082";
            proxy_pass $storage_upstream/ready$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # ③ 兼容旧路径（行为不变，仍是目录服务）：/ready 是既有的就绪判据；
        #    /health 目录侧已实现（backend/cmd/server/main.go 注册 GET /health，返回 status+service，
        #    与其它服务同形），这条照常转发，不再有"补齐前如实 404"的情况。
        location = /ready {
            set $backend_upstream "http://backend:8080";
            proxy_pass $backend_upstream/ready$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /health {
            set $backend_upstream "http://backend:8080";
            proxy_pass $backend_upstream/health$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # === 5. 三个服务自带的管理台（独立应用 + 同域路径；决议见解耦审计 §7.3） ===
        # 三个管理台是与主前端并列的独立 Next 应用：页面与静态资源都在这里的路径下（不是 /api/），
        # 页面不挂 limit_req，与 /docs 一样按路径挂载；仅未验证凭据的精确 API 路径用认证桶，靠应用自身的
        # 鉴权与路由级限流兜底。它们的数据请求仍旧走 /api/*，由上面已按域分好的 location 分流回对应的服务。
        #   /admin/account/   → 账号域：/api/auth|setup|admin|oauth|oidc|developer 等
        #   /admin/community/ → 互动域：/api/community|favorites|messages 等
        #   /admin/storage/   → 存储域：/api/storage
        # 三条都是 /admin/ 下的两段前缀，与主站 `location /`（主前端，含目录控制台 /admin）互不重叠；
        # 前缀更长者胜，因此主站的 /admin 不受影响。

        location /admin/account/ {
            set $auth_admin_upstream "http://auth-admin:3000";
            proxy_pass $auth_admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location /admin/community/ {
            set $community_admin_upstream "http://community-admin:3000";
            proxy_pass $community_admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location /admin/storage/ {
            set $storage_admin_upstream "http://storage-admin:3000";
            proxy_pass $storage_admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # 无尾斜杠的裸路径必须显式 301 到带尾斜杠的形式：否则 /admin/account 会被最宽的
        # location / 兜给主前端，表现为 404。精确匹配优先级最高，放前缀 location 前后都稳。

        location = /admin/account {
            return 301 /admin/account/;
        }

        location = /admin/community {
            return 301 /admin/community/;
        }

        location = /admin/storage {
            return 301 /admin/storage/;
        }

        # === 6. 账号自助应用（独立应用 + 精确路径；与管理台同模式） ===
        # Next 静态资源使用独立前缀；/login 与 /setup 的 HTML 来自 auth-user，
        # 不能让共用域名上的 /_next/static 请求落到主前端。
        location ^~ /auth-user-assets/_next/static/ {
            set $auth_user_upstream "http://auth-user:3000";
            rewrite ^/auth-user-assets/_next/static/(.*)$ /_next/static/$1 break;
            proxy_pass $auth_user_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # /login 与 /setup 曾由主前端提供（location / 兜底）。精确匹配优先于前缀
        # location，因此这两条一生效，主前端的同路径页面即被分流（回滚：删掉这两条
        # 并重建网关容器，见切流手册）。页面 GET 不挂 limit_req（与管理台同口径）：
        # 凭据猜测面是底下的 login/register 精确 API，那里已有 auth_limit；归属登记在
        # service-split-migration.md §2（auth 行），check_gateway_matrix.py 逐条核对。
        location = /login {
            set $auth_user_upstream "http://auth-user:3000";
            proxy_pass $auth_user_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        location = /setup {
            set $auth_user_upstream "http://auth-user:3000";
            proxy_pass $auth_user_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # === 7. 文档站与前端 ===

        # 独立全量文档站 (SSG/SSR)
        location /docs {
            set $docs_upstream "http://docs-site:3001";
            proxy_pass $docs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }

        # 前端 Next.js 页面与静态资源 (包含 /admin, /invites, /community 等所有页面)
        location / {
            set $frontend_upstream "http://frontend:3000";
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }
    }
}
