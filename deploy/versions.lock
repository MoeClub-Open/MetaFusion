# deploy/versions.lock —— 一次部署的版本锚点
#
# 为什么要它：编排（deploy/docker-compose.yml）以兄弟仓库为构建上下文（默认 ../../metafusion-*，
# 可用 MF_*_DIR 覆盖布局，见 runbook「部署目录布局」），主仓库代码与
# 兄弟仓库代码之间没有任何版本绑定——同一个 METAFUSION_TAG 可能对应不同的兄弟仓库提交，
# 回滚时无法判断当时那份 community 是哪一次提交。这里把这些部署输入钉住。
#
# 格式：<仓库目录>=<commit 短 sha>；. 是本仓库，.. 是与本仓库并列检出的兄弟目录。
# 校验：python scripts/check_versions.py（deploy.sh 的 fast/prod/pull 每个动作开头都会跑，
#       不一致就非零退出；紧急放行用 --skip-version-check，跳过原因会写进部署日志）
#   - 逐条 git -C <目录> rev-parse HEAD 与锁里的 sha 比对；
#   - 兄弟目录不在本机（只检出主仓库的机器、CI 上很常见）→ 打印 skip，不算失败；
#   - 某条不一致 → 打印期望与实际并以非零码退出，部署前停下；
#   - 主仓库自身那条只提示不判失败：锁文件随主仓库提交一起前进，回滚时以本文件所在的提交为准。
# 更新：切流窗口开始时按各仓库 git rev-parse --short HEAD 重写一遍并提交。
#       不要为了让它变绿而改 sha——那等于把锚点挪到没验证过的代码上。
#
# 缺口口径（2026-09-26 审计的"CI 只检出主仓库"已收窄）：.github/workflows/ci.yml 的 cross-repo job
# 现在按这份锁的每一行（含 api-gateway 与 docs，包括 MCP 与技能仓）逐个 clone 到 ../ 并检出该 sha，
# 再跑 check_versions.py，因此"锁里的 sha 在远端取不到"会让 CI 红。仍未守住的是反向：CI 检出的是
# 锁里的 sha，自然与锁一致——"本机检出比锁新/旧"只能由 deploy.sh 的那一步拦。
#
# 当前锚点：各部署输入的已验证 HEAD；刷新时使用各仓远端同步后的提交。
# 更新时按各仓库 git rev-parse --short HEAD 重写，并在同一次提交里跑一遍 python scripts/check_versions.py。
