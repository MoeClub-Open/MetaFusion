name: Release & Container Publishing

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "v*"]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "是否同时打上 latest 标签"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

# 串行化所有发布运行：main push 与 tag 构建排队执行，避免互相打断或竞争 latest 标签
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 同 SHA 门禁（审计 O04）：镜像只在**本次提交**的必要检查通过后才构建发布。
  # 跨工作流无法 needs，因此把必要检查在发布工作流内重跑一次（同一 SHA）：
  # required-checks 只守离线口径，Go/数据库、前端、跨仓分别由后面三个 job 在同 SHA 重跑，
  # docker-publish 需要四者全绿才提升产物——业务 CI 红了仍可发布镜像的空档关闭。
  # tag 只应在 CI 全绿的提交上打——不要用“CI 红了但 release 绿了”的提交去部署。
  required-checks:
    name: Same-SHA required checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 编排与网关离线检查（与 CI 同口径）
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_deploy.py
          python3 scripts/check_gateway_matrix.py
          python3 scripts/check_ci_scripts.py
      - name: 版本锁检查（缺席兄弟仓逐条记录，不静默跳过）
        # 发布检出只有主仓库，兄弟目录缺席时 check_versions.py 逐条 SKIP（审计 §6）。
        # 跳过≠验证：这里把缺席清单写进步骤摘要并标 warning，内容核验以 cross-repo-check
        #（按锁检出兄弟仓实跑）为准；本步只守格式与主仓可检项。
        run: |
          set -o pipefail
          python3 scripts/check_versions.py 2>&1 | tee /tmp/versions-check.log
          skips=$(grep -c '^skip ' /tmp/versions-check.log || true)
          {
            echo "### 版本锁（required-checks 内）"
            echo ""
            echo '```'
            cat /tmp/versions-check.log
            echo '```'
            echo ""
            echo "缺席跳过 ${skips} 项：内容核验见 cross-repo-check（同 SHA 实仓校验）。"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${skips:-0}" != "0" ]; then
            echo "::warning::版本锁有 ${skips} 项兄弟仓缺席跳过（仅格式检查），内容以 cross-repo-check 为准"
          fi

  # 同 SHA 后端门禁：镜像推送前先证明本次提交的 Go 代码在真库上可测可构建
  #（与 CI backend job 同口径；-race 与 OpenAPI 双向覆盖留在 CI，发布门禁只守必要项）。
  backend-check:
    name: Same-SHA backend (Go + DB + OpenSearch)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mf_v2_test
        ports: ["5432:5432"]
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2.14.0
        env:
          discovery.type: single-node
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      MF_V2_TEST_DSN: postgres://postgres:test-only-password@127.0.0.1:5432/mf_v2_test?sslmode=disable
      MF_OPENSEARCH_TEST_URL: http://127.0.0.1:9200
      MF_REQUIRE_INTEGRATION_TESTS: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: test-only-password
      DB_NAME: mf_v2_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true
      - name: go test (with DB and OpenSearch)
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: go build (server+migrate)
        run: |
          CGO_ENABLED=0 go build -o /tmp/mf-server ./cmd/server
          CGO_ENABLED=0 go build -o /tmp/mf-migrate ./cmd/migrate

  # 同 SHA 前端门禁（与 CI frontend job 同口径）：安装严格锁定（无兜底），
  # tsc、i18n 与 Next 构建都在同 SHA 先跑一遍，破了不进镜像构建。
  frontend-check:
    name: Same-SHA frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: bun install (strict, no fallback)
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bunx tsc --noEmit
      - name: frontend unit tests
        run: bun test tests
      - name: i18n keys sync check
        run: |
          bun -e "const fs=require('fs');const ks=f=>Object.keys(JSON.parse(fs.readFileSync('src/messages/'+f,'utf8'))).sort().join('|');const base=ks('zh-CN.json');for(const f of ['en-US.json','zh-TW.json','ja-JP.json']){if(ks(f)!==base){console.error('i18n drift: '+f);process.exit(1)}}console.log('i18n keys in sync')"
      - name: next build (via Bun)
        run: bun run build

  # 同 SHA 跨仓门禁（与 CI cross-repo job 同口径）：按锁把兄弟仓检出到锁里的 sha 再验，
  # 锁里的 sha 在远端取不到（本地未推送的提交）明确失败，不用 continue-on-error 盖过去。
  # 审计 DDL 与文档路由的全量比对留在 CI，发布门禁只守版本锁、环境矩阵与契约生成物。
  cross-repo-check:
    name: Same-SHA cross-repo (versions + env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 按 deploy/versions.lock 的 sha 检出兄弟仓库
        run: |
          set -euo pipefail
          failed=0
          while IFS='=' read -r repo sha; do
            name="${repo#../}"
            git clone --quiet "https://github.com/MoeclubM/${name}.git" "../${name}"
            if git -C "../${name}" checkout --quiet --detach "$sha" 2>/dev/null; then
              continue
            fi
            if git -C "../${name}" fetch --quiet origin "$sha" 2>/dev/null; then
              git -C "../${name}" checkout --quiet --detach FETCH_HEAD
              continue
            fi
            echo "::error::锁里的 ${name}=${sha} 在远端仓库取不到：先把该仓库推到远端，或按 deploy/versions.lock 的流程刷新锚点"
            failed=1
          done < <(grep -E '^\.\./[A-Za-z0-9_.-]+=' deploy/versions.lock)
          exit "$failed"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: 锁定技能的 TypeScript 工具检查
        working-directory: ../metafusion-skills
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          test -z "$(git ls-files '*.mjs')"
      - name: 版本锁一致性（兄弟仓就位，无缺席跳过）
        run: python3 scripts/check_versions.py
      - name: 环境变量矩阵（注入↔读取两个方向）
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_env_matrix.py
          python3 scripts/check_env_matrix.py --selftest
      - name: 契约生成物 ↔ 锚点来源一致性
        run: node frontend/scripts/generate-contracts.mjs --check

  docker-publish:
    name: Build & Publish Container Images
    needs: [required-checks, backend-check, frontend-check, cross-repo-check]
    runs-on: ubuntu-latest
    env:
      # GHCR 要求镜像仓库路径全小写；此处为唯一来源，需与 deploy/docker-compose.prod.yml 一致
      IMAGE_PREFIX: ghcr.io/moeclubm/metafusion
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: server
            image_name: backend
            # /api/version 的版本身份：镜像里没有 .git，只有构建期注入才靠得住。
            # GIT_SHA 用本次构建的提交，APP_VERSION 用 ref 名（tag 上是 tag，main 上是 main）；
            # migrator 镜像不需要——迁移器二进制不带这两个 -X。
            build_args: |
              GIT_SHA=${{ github.sha }}
              APP_VERSION=${{ github.ref_name }}
          - name: backend-migrator
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: migrator
            image_name: migrator
          - name: frontend-app
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: ""
            image_name: frontend
            # Next 的 NEXT_PUBLIC_* 是**构建期内联**：镜像发布后改运行期 env 无效。
            # 这里从仓库变量 vars.* 取值，未配置时为空 → 前端按同源网关路径工作
            # （与当前部署一致）。只有资源站与文档站是真正的外部站点，因此只留这两个。
            build_args: |
              NEXT_PUBLIC_RESOURCE_STATION_URL=${{ vars.NEXT_PUBLIC_RESOURCE_STATION_URL }}
              NEXT_PUBLIC_DOCS_URL=${{ vars.NEXT_PUBLIC_DOCS_URL }}
          # 文档站镜像目前**没有任何仓库发布**（metafusion-docs 的 .github 下只有 ci.yml，
          # 不含 ghcr / build-push-action），生产编排里那份只能就地构建；本仓库只构建目录/前端
          # 与迁移器镜像。等文档站自己发布镜像时，改这里的口径并给 prod 覆盖文件写上 image。

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.inputs.publish_latest == 'true' }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target != '' && matrix.target || null }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # digest 只认这一步的实际产物：写文件并随构件带走，清单生成器原样收录、绝不手填。
      # /tmp 是 check_ci_scripts 的运行时豁免前缀，这里不引用任何仓库内脚本。
      - name: Record image digest
        run: |
          mkdir -p /tmp/digests
          printf '%s' '${{ steps.build.outputs.digest }}' > "/tmp/digests/${{ matrix.image_name }}.digest"
          printf '%s' '${{ steps.meta.outputs.tags }}' > "/tmp/digests/${{ matrix.image_name }}.tags"
      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image_name }}
          path: /tmp/digests/
          retention-days: 90

  # 跨仓发布 manifest：一次发布“是什么”只认这一份文件——主仓 SHA、版本锁锚点、
  # 目录库迁移文件、每服务独立引用（repository/tags/digest）与迁移器同源绑定。
  # digest 只认上一步 digest-* 构件里的实际产物，由脚本收录、未知标待填绝不手填；
  # 不完整清单在这里直接失败，不流到部署机。tag 发布时随附件带走，main 推送
  # 以构建产物形式保留 90 天；部署与回滚以它为准，不以 latest 标签为准。
  release-manifest:
    name: Cross-repo release manifest
    needs: [docker-publish]
    runs-on: ubuntu-latest
    env:
      # 与 docker-publish 的 IMAGE_PREFIX 同一来源，清单里各服务 repository 由它生成
      IMAGE_PREFIX: ghcr.io/moeclubm/metafusion
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests-in
      - name: Write cross-repo manifest
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/build_release_manifest.py --digests-dir digests-in --out release-manifest.yaml
      # 部署前拒绝不完整清单的第一道门：digest/版本组合/同源绑定任一缺失即红，
      # 第二道门在 deploy.sh pull（部署机按 IMAGE_TAG 再验一次）。
      - name: Reject incomplete manifest
        run: python3 scripts/check_release_manifest.py --strict release-manifest.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: release-manifest.yaml
          retention-days: 90

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker-publish, release-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Cross-Platform Migration Tools
        working-directory: backend
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-linux-amd64 ./cmd/migrate
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-linux-arm64 ./cmd/migrate
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-windows-amd64.exe ./cmd/migrate
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-darwin-arm64 ./cmd/migrate

      - name: Download release manifest（随附件发布）
        uses: actions/download-artifact@v8
        with:
          name: release-manifest
          path: manifest-in

      - name: Attach manifest to dist
        run: cp ../manifest-in/release-manifest.yaml ../dist/release-manifest.yaml
        working-directory: backend

      - name: Generate Changelog & Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
