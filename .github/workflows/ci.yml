name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：contents 供 checkout，pull-requests 供 gitleaks 扫描 PR 提交
permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: backend (go vet & build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mf_v2_test
        ports: ["5432:5432"]
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2.14.0
        env:
          discovery.type: single-node
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      MF_V2_TEST_DSN: postgres://postgres:test-only-password@127.0.0.1:5432/mf_v2_test?sslmode=disable
      MF_OPENSEARCH_TEST_URL: http://127.0.0.1:9200
      MF_REQUIRE_INTEGRATION_TESTS: "1"
      # cmd/migrate 读的是 DB_*（不是 MF_V2_TEST_DSN）。服务容器里的用户是 postgres，
      # 而 config 的默认值是 metafusion —— 迁移回滚步骤因为这条不匹配长期失败。
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: test-only-password
      DB_NAME: mf_v2_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: go test
        run: go test ./...
      - name: go test -race (catalog)
        run: go test -race ./internal/catalog/
      - name: openapi bidirectional coverage
        run: go test ./internal/catalog/ -run 'TestOpenAPIRouteCoverage|TestOpenAPIReverseCoverage' -v
      - name: go vet
        run: go vet ./...
      - name: go build (server+migrate)
        run: |
          CGO_ENABLED=0 go build -o /tmp/mf-server ./cmd/server
          CGO_ENABLED=0 go build -o /tmp/mf-migrate ./cmd/migrate
      - name: migrate up and irreversible down guard
        run: |
          /tmp/mf-migrate up
          /tmp/mf-migrate status
          if /tmp/mf-migrate down > /tmp/mf-down.log 2>&1; then
            echo "irreversible migration unexpectedly rolled back" >&2
            exit 1
          fi
          grep -q '000034_assistant is irreversible' /tmp/mf-down.log
          /tmp/mf-migrate up
          /tmp/mf-migrate status
      - name: 悬挂引用体检（check-refs 冒烟）
        # check-refs 是部署与恢复手册中的悬挂引用体检命令。
        # 这里在刚迁移完、还没有任何实体的库上跑一遍：证明它能连库、能读定义/实体/关系并给出
        # "0 条"的结论——同一条命令在库里有悬挂引用时退 1，因此可以直接挂进部署流水线卡住上线。
        run: /tmp/mf-migrate check-refs

  frontend:
    name: frontend (Bun 1.4 + Next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Next 16 要求 Node >= 20.9（next/dist/bin/next 里是硬断言）。这个 job 全程跑在 Bun 上，
      # 用的是 Bun 自带的 Node 兼容版本号（实测 Bun 1.4.3 报 process.versions.node=26.3.0），
      # 因此不需要另外 setup-node；换 Bun 版本时先确认这一条，否则会在构建第一步就红。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bunx tsc --noEmit
      - name: frontend unit tests
        run: bun test tests
      # 这里原有一步 `bun run lint`（package.json 的 lint 脚本 = next lint）。Next 16 移除了
      # next lint 命令，而仓库本来也没有 eslint 配置文件（旧步骤只会打印 "no eslint config"），
      # 故脚本与步骤一起删除。要恢复 lint 请单独一轮接入 typescript-eslint，不要混进本次升级。
      - name: i18n keys sync check
        run: |
          bun -e "const fs=require('fs');const ks=f=>Object.keys(JSON.parse(fs.readFileSync('src/messages/'+f,'utf8'))).sort().join('|');const base=ks('zh-CN.json');for(const f of ['en-US.json','zh-TW.json','ja-JP.json']){if(ks(f)!==base){console.error('i18n drift: '+f);process.exit(1)}}console.log('i18n keys in sync')"
      - name: i18n 使用面（悬空键 + 死键报告）
        # 键集合比对只保证四语彼此一致，抓不到反向：代码 t() 了一个字典里根本没有的键，
        # 界面上会把裸 key 显示出来。死键部分是报告项（--strict-dead 才失败）。
        # 判据、动态前缀白名单与 --list-dead / --prune 的用法见脚本头部注释。
        run: node scripts/check_i18n_usage.mjs
      - name: 语言表生成物一致性
        # src/lib/languages.ts 由 scripts/gen-languages.mjs 从消息字典生成；不跑生成器
        # 就会和字典/语言数据漂移（langs:build 是本机修法，CI 只校验）。
        run: bun run langs:check
      - name: JSX 裸文案检查
        # 四语键集合比对抓不到写死在 JSX 里的文案；判据与白名单见脚本顶部说明。
        run: node scripts/check_jsx_literals.mjs
      - name: page shell check
        # 页面容器不得自写宽度/内边距（外壳只有 PageShell 一处）；纯 node，无需依赖。
        working-directory: .
        run: node scripts/check_page_shell.mjs
      - name: 契约生成物部分一致性（本仓来源 / kinds）
        # 生成物由 frontend/scripts/generate-contracts.mjs 从后端与各子系统源码提取；
        # 这里是主仓独立检出，显式选择部分校验；跨仓 job 检查全部来源且缺源失败。
        run: node scripts/generate-contracts.mjs --check --allow-missing-sources
      - name: 设计令牌守门（源码用到的令牌类名必须产出 CSS）
        # 上一轮的事故：37 个语义令牌类名在源码里写了、产出 CSS 里一条都没有——未注册的颜色
        # Tailwind 直接跳过，而 tsc 与 next build 全绿。脚本用项目自己的 tailwind.config.ts
        # 编译一次再逐个查选择器，并守住令牌清单（含 <alpha-value>）、深浅两套模式块里的
        # 变量定义，以及"字面白/调色板色不许写回来"这条迁移成果。
        run: node scripts/check-design-tokens.mjs

      - name: next build (via Bun)
        run: bun run build

  # 监控基线只在配置/文档层：阈值与分工见 deploy/monitoring-baseline.md（指标→告警→处理人），
  # 本 job 不复制第二份数字，改阈值只改那一个文件。
  compose-lint:
    name: compose & nginx lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        env:
          # docker-compose.yml 使用 :? 校验的必填变量，CI 中一律注入 test-only 假值
          DB_PASSWORD: test-only-password
          CATALOG_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          AUTH_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          AUTH_MIGRATION_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          COMMUNITY_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          STORAGE_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          RUSTFS_ACCESS_KEY: test-only-user
          RUSTFS_SECRET_KEY: test-only-password
          # RUSTFS_IMAGE 是 rustfs 服务的 :? 必填插值（与 .env.example 占位示例同形）：
          # config 只做插值不拉镜像，给 test-only 假值即可，干净 runner 可过解析
          RUSTFS_IMAGE: rustfs/rustfs:test-only
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: metadata-only compose config
        env:
          DB_PASSWORD: test-only-password
          CATALOG_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          AUTH_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          AUTH_MIGRATION_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          COMMUNITY_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          STORAGE_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
        run: docker compose -f deploy/docker-compose.metadata.yml config --quiet
      - name: nginx syntax check
        run: docker run --rm -v $PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.25-alpine nginx -t
      - name: metadata nginx syntax check
        run: docker run --rm -v $PWD/deploy/nginx.metadata.conf:/etc/nginx/nginx.conf:ro nginx:1.25-alpine nginx -t
      # dev / prod 覆盖文件是 deploy.sh 的 dev / pull 动作实际用的合并输入：只给
      # docker-compose.yml 做 config 检查时，覆盖文件里的 YAML/标签错误要到部署当天才暴露。
      - name: dev & prod override config
        env:
          DB_PASSWORD: test-only-password
          CATALOG_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          AUTH_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          AUTH_MIGRATION_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          COMMUNITY_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          STORAGE_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          RUSTFS_ACCESS_KEY: test-only-user
          RUSTFS_SECRET_KEY: test-only-password
          # 同上：覆盖文件合并仍解析 base 的 :? 必填项，假值与上一步同口径
          RUSTFS_IMAGE: rustfs/rustfs:test-only
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet
      - name: 生产凭据隔离（只查键名，不打印值）
        # 审计 O01：四个常驻业务容器只能持有本域 DATABASE_URL，不得出现 DB_*；
        # 除 storage 外不得出现 STORAGE_S3_*/RUSTFS_*。config 输出含插值后的真值，
        # 因此断言只打印键名与通过/失败结论，值永不进日志。
        env:
          DB_PASSWORD: test-only-password
          CATALOG_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          AUTH_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          AUTH_MIGRATION_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          COMMUNITY_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          STORAGE_DATABASE_URL: postgres://postgres:test-only-password@postgres:5432/metafusion_db?sslmode=disable
          RUSTFS_ACCESS_KEY: test-only-user
          RUSTFS_SECRET_KEY: test-only-password
          # 同上：断言前两处 config 合并都要先过 :? 插值，假值与上同口径
          RUSTFS_IMAGE: rustfs/rustfs:test-only
        run: |
          python3 -m pip install --quiet pyyaml
          cat > /tmp/assert_keys.py <<'PYEOF'
          import sys
          import yaml
          which = sys.argv[1]
          doc = yaml.safe_load(sys.stdin) or {}
          svcs = doc.get("services", {}) or {}
          banned_db = {"DB_HOST", "DB_PORT", "DB_USER", "DB_PASSWORD", "DB_NAME",
                       "AUTH_MIGRATION_DATABASE_URL", "MCP_MIGRATION_DATABASE_URL"}
          banned_s3 = {"STORAGE_S3_ACCESS_KEY", "STORAGE_S3_SECRET_KEY",
                       "RUSTFS_ACCESS_KEY", "RUSTFS_SECRET_KEY"}
          bad = []
          for name in ("backend", "auth", "community", "storage"):
              env = (svcs.get(name) or {}).get("environment") or []
              keys = set()
              for item in env:
                  keys.add(str(item).split("=", 1)[0].strip())
              leak = sorted(keys & banned_db)
              if leak:
                  bad.append("%s 持有管理凭据键：%s" % (name, ",".join(leak)))
              if "DATABASE_URL" not in keys:
                  bad.append("%s 缺少 DATABASE_URL 键" % name)
              if name != "storage":
                  sleak = sorted(keys & banned_s3)
                  if sleak:
                      bad.append("%s 持有对象凭据键：%s" % (name, ",".join(sleak)))
          if bad:
              print("[%s] 凭据隔离未通过（只列键名，不打印值）：" % which)
              for b in bad:
                  print("  - " + b)
              sys.exit(1)
          print("[%s] 凭据隔离通过：4 个服务仅本域 DSN（键名已核对，值未打印）" % which)
          PYEOF
          docker compose -f deploy/docker-compose.yml config | python3 /tmp/assert_keys.py base
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config | python3 /tmp/assert_keys.py prod
      # config 解析不出"build.target 在 Dockerfile 里不存在"（曾把 catalog-server 当真），
      # 也看不出必填变量没写进 .env.example；这两项由本仓库脚本补齐，本机无 docker 也能跑。
      # --selftest 是脚本自带的离线用例（变量展开 / 路径解析）：它自己坏了要在 CI 就红，
      # 而不是等到某天没人发现「检查其实没跑」。
      - name: deploy 编排自检（构建目标 / 必填变量 / 自测）
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_deploy.py
          python3 scripts/check_deploy.py --selftest
      # 下面两个脚本只用标准库，不需要网络与 docker：网关矩阵是唯一入口的“线上真图”，
      # 它与文档 §2 表、与各仓库版本锁的关系只能靠机器守（2026-09 审计 §6）。
      - name: 网关矩阵 ↔ 文档 §2 表一致性
        run: |
          python3 scripts/check_gateway_matrix.py
          python3 scripts/check_gateway_matrix.py --selftest
      - name: CI 脚本存在性元检查
        # 本轮出现过"CI 引用了脚本但脚本没入库"，表现是 job 在干净检出上红、本地看不出来。
        # 这里只做检查，不再装依赖（脚本是纯标准库，--selftest 是它自己的离线用例）。
        run: |
          python3 scripts/check_ci_scripts.py
          python3 scripts/check_ci_scripts.py --selftest
      - name: 文档端点契约脚本离线自测
        # 真跑要兄弟仓库（在 cross-repo job）；这里先证明脚本本体的归一化与两个方向判定没坏，
        # 否则它会静默地"永远 0 问题"。
        run: python3 scripts/check_doc_routes.py --selftest
      # 版本锁与环境变量矩阵需要兄弟仓库源码，放在下面的 cross-repo job：
      # 这里只检出主仓库，跑 check_versions.py 只会逐条 SKIP（审计 ops#9 的“恒 SKIP”）。
  # 跨仓检查：版本锁与环境变量矩阵都要看兄弟仓库源码/提交，因此先把它们按锁检出。
  # 刻意用独立 job：这一步会 clone 五个仓库，失败原因（锚点取不到 / 编排注入了没人读的变量）
  # 与 compose 语法检查是两件事，混在一起会让"哪个环节红了"变难判。
  cross-repo:
    name: 版本锁与环境变量矩阵（跨仓）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 按 deploy/versions.lock 的 sha 检出兄弟仓库
        # 为什么需要它：check_versions.py 对缺席的兄弟目录是"跳过"，而 CI 以前只检出主仓库，
        # 于是版本锁恒等于没跑（2026-09 审计 ops#9）。这里按锁里的 sha 逐个 clone 并 checkout：
        #   - 锁里的 sha 在远端可取 → 锚点可被任何人复现，检查真的跑起来；
        #   - 取不到（本地未推送的提交）→ 明确失败，不用 continue-on-error 把它盖过去。
        # 口径说明：这一步证明的是"锁里的 sha 在远端仓库存在且可检出"，不是"某台机器的本地检出与锁一致"。
        run: |
          set -euo pipefail
          failed=0
          while IFS='=' read -r repo sha; do
            name="${repo#../}"
            git clone --quiet "https://github.com/MoeclubM/${name}.git" "../${name}"
            if git -C "../${name}" checkout --quiet --detach "$sha" 2>/dev/null; then
              continue
            fi
            if git -C "../${name}" fetch --quiet origin "$sha" 2>/dev/null; then
              git -C "../${name}" checkout --quiet --detach FETCH_HEAD
              continue
            fi
            echo "::error::锁里的 ${name}=${sha} 在远端仓库取不到：先把该仓库推到远端，或按 deploy/versions.lock 的流程刷新锚点"
            failed=1
          done < <(grep -E '^\.\./[A-Za-z0-9_.-]+=' deploy/versions.lock)
          exit "$failed"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: 锁定技能的 TypeScript 工具检查
        working-directory: ../metafusion-skills
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          test -z "$(git ls-files '*.mjs')"
      - name: 版本锁一致性
        run: python3 scripts/check_versions.py
      - name: 环境变量矩阵（注入↔读取两个方向）
        # 兄弟仓库已在上一步就位，因此这里三个方向都是全量校验：注入了没人读、
        # 默认不安全却没注入、登记表与代码漂移（2026-09 审计：这两个方向原来都没有机器守）。
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_env_matrix.py
          python3 scripts/check_env_matrix.py --selftest
      - name: 审计表 DDL 一致性（授权脚本预建 ↔ 四个服务副本）
        # audit.audit_log 是跨四仓共用的表，DDL 天然有 4 份服务副本；授权脚本第 3b 节又加了一份
        # **预建**副本（部署时以它为准，owner 才会固定是 mf_audit_owner）。副本漂移的后果是
        # "预建的列"与"服务以为的列"分叉 → 审计行静默写失败，而没有任何现有检查会红。
        # 这里逐条语句比对全部来源，并用结构断言兜住列数/索引/锁键；缺席的兄弟仓库记"未能校验"。
        run: |
          python3 scripts/check_audit_schema.py
          python3 scripts/check_audit_schema.py --selftest
      - name: 契约生成物 ↔ 锚点来源一致性（权限码 / kinds）
        # frontend job 里那一步其实没有兄弟仓库：缺席时生成器沿用生成物里的现有取值，
        # 兄弟侧权限码等于没校验（本地实测：锚点来源与生成物一致时才真能守住）。
        # 这里兄弟仓库已按 versions.lock 锚点就位，加码/改码漏改生成物会真的失败。
        run: node frontend/scripts/generate-contracts.mjs --check
      - name: 文档端点 ↔ 后端路由一致性
        # 文档站写过不存在的端点（例如 change-password 别名）而没人发现：只有"文档有、实现无"
        # 的主仓 /api 端点会非零退出，反向（实现有、文档没写）只报告。兄弟仓库按 versions.lock
        # 检出在 ../ 下，正是脚本默认的搜索起点；缺席时脚本 SKIP 并退 0。
        run: python3 scripts/check_doc_routes.py

  # 文档站已独立为 metafusion-docs 仓库（唯一源），构建与链接自查在那边跑；
  # 本仓库不再持有 doc 页面，故这里没有 docs-site job。

  secrets-scan:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
